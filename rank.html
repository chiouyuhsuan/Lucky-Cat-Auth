<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>全球幸運貓排行榜 — LuckyCat</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Noto Sans TC','PingFang TC',sans-serif;background:#F4F2FB;color:#26215C;min-height:100vh}
.topnav{background:#FAF0FB;border-bottom:0.5px solid #CECBF6;padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:1000}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.logo-icon{width:32px;height:32px;background:#7F77DD;border-radius:10px;display:flex;align-items:center;justify-content:center}
.logo-text{font-size:16px;font-weight:500;color:#3C3489}
.nav-links{display:flex;gap:4px}
.nav-link{padding:6px 12px;border-radius:8px;font-size:13px;color:#534AB7;text-decoration:none}
.nav-link:hover,.nav-link.active{background:#EEEDFE;font-weight:500}
.nav-cta{padding:7px 14px;background:#534AB7;color:#EEEDFE;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;font-family:inherit}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
@media(max-width:580px){.stats-row{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:#fff;border:0.5px solid #CECBF6;border-radius:12px;padding:14px;text-align:center}
.stat-val{font-size:22px;font-weight:500;margin-bottom:2px}
.stat-lbl{font-size:11px;color:#888780}

/* MAP */
.map-wrap{background:#fff;border:0.5px solid #CECBF6;border-radius:16px;overflow:hidden;margin-bottom:20px}
.map-topbar{padding:12px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:0.5px solid #CECBF6;flex-wrap:wrap;gap:8px}
.map-title{font-size:14px;font-weight:500}
.map-legend{display:flex;gap:14px;font-size:11px;color:#888780}
.leg{display:flex;align-items:center;gap:5px}
.leg-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
#leafmap{width:100%;height:380px;z-index:1}
@media(max-width:580px){#leafmap{height:240px}}

/* country banner */
.cc-banner{display:none;background:#EEEDFE;border-radius:12px;padding:11px 16px;margin-bottom:14px;align-items:center;justify-content:space-between}
.cc-banner.show{display:flex}
.cc-close{font-size:12px;color:#888780;cursor:pointer;padding:4px 10px;border:0.5px solid #AFA9EC;border-radius:20px;background:transparent;font-family:inherit}

/* FILTERS */
.filter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.f-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.f-lbl{font-size:12px;color:#888780;white-space:nowrap}
.chip{padding:5px 13px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:0.5px solid #CECBF6;background:#fff;color:#534AB7;transition:all .13s;font-family:inherit}
.chip:hover{background:#EEEDFE}
.chip.on{background:#534AB7;color:#EEEDFE;border-color:#534AB7}
.f-sep{width:1px;height:20px;background:#CECBF6}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px}

/* RANK */
.rank-list{display:flex;flex-direction:column;gap:8px}
.rc{background:#fff;border:0.5px solid #CECBF6;border-radius:14px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px}
.rc:hover{border-color:#AFA9EC}
.rc.mine{border:1.5px solid #7F77DD;background:#EEEDFE}
.rc-num{font-size:15px;font-weight:500;min-width:26px;flex-shrink:0;padding-top:2px}
.rc-photo{width:54px;height:54px;border-radius:10px;overflow:hidden;flex-shrink:0;background:#FAC775;border:1.5px solid #EF9F27;display:flex;align-items:center;justify-content:center;font-size:26px}
.rc-photo img{width:100%;height:100%;object-fit:cover}
.rc-body{flex:1;min-width:0}
.rc-name{font-size:15px;font-weight:500;margin-bottom:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rc-meta{font-size:12px;color:#888780;margin-bottom:8px}
.balls{display:flex;gap:5px;flex-wrap:wrap}
.b{width:28px;height:28px;border-radius:50%;background:#7F77DD;color:#EEEDFE;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.b.sp{background:#EF9F27;color:#412402}
.rc-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.badge-me{font-size:10px;background:#7F77DD;color:#EEEDFE;padding:2px 8px;border-radius:10px}
.empty{text-align:center;padding:48px 16px;color:#888780}
.loading{display:flex;gap:6px;justify-content:center;padding:40px}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.dot{width:8px;height:8px;border-radius:50%;background:#7F77DD}
.dot:nth-child(1){animation:bounce 1.2s infinite 0s}
.dot:nth-child(2){animation:bounce 1.2s infinite .2s}
.dot:nth-child(3){animation:bounce 1.2s infinite .4s}

/* TABS */
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{flex:1;padding:10px 6px;border-radius:12px;border:0.5px solid #CECBF6;background:#fff;color:#534AB7;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.tab.on{background:#534AB7;color:#fff;border-color:#534AB7}
.tab-note{font-size:12px;color:#888780;margin:0 2px 12px}
.rc-stats{font-size:12px;color:#534AB7}
.rc-big{font-size:18px;font-weight:700;white-space:nowrap}
.rc-sub{font-size:11px;color:#888780}
.b.hit{background:#3B6D11;color:#fff}

/* 底圖調淡，讓貓咪圓圈比較明顯 */
.leaflet-tile-pane{filter:saturate(.55) brightness(1.06)}

/* Leaflet custom marker */
.cat-marker{background:#7F77DD;border:2.5px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer;transition:transform .15s}
.cat-marker:hover{transform:scale(1.25)}
.cat-marker.won{background:#EF9F27}
</style>
<link rel="stylesheet" href="css/mobile.css"/>
<script src="js/analytics.js"></script>
</head>
<body>

<nav class="topnav">
  <a class="logo" href="index.html">
    <div class="logo-icon">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <ellipse cx="10" cy="13" rx="7" ry="5.5" fill="#EEEDFE" opacity=".9"/>
        <polygon points="4,9 7,3 10,9" fill="#EEEDFE" opacity=".9"/>
        <polygon points="10,9 13,3 16,9" fill="#EEEDFE" opacity=".9"/>
        <circle cx="7.5" cy="11.5" r="1.5" fill="#3C3489"/>
        <circle cx="12.5" cy="11.5" r="1.5" fill="#3C3489"/>
        <ellipse cx="10" cy="14" rx="2" ry="1.2" fill="#F4C0D1"/>
      </svg>
    </div>
    <span class="logo-text">LuckyCat</span>
  </a>
  <div class="nav-links">
    <a class="nav-link" href="index.html">首頁</a>
    <a class="nav-link" href="index.html">上傳</a>
    <a class="nav-link active" href="rank.html">排行榜</a>
    <a class="nav-link" href="wall.html">貓咪牆</a>
    <a class="nav-link" href="about.html">關於</a>
  </div>
  <a class="nav-cta" href="index.html">開始選號</a>
</nav>

<div class="wrap">
  <h1 style="font-size:22px;font-weight:500;margin-bottom:4px">全球幸運貓排行榜</h1>
  <p style="font-size:14px;color:#534AB7;margin-bottom:20px">台灣大樂透 · 點擊地圖標記可篩選國家</p>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-val" style="color:#534AB7" id="s-cats">—</div><div class="stat-lbl">參賽貓咪</div></div>
    <div class="stat-card"><div class="stat-val" style="color:#3B6D11" id="s-prize">—</div><div class="stat-lbl">累積獎金</div></div>
    <div class="stat-card"><div class="stat-val" style="color:#993C1D" id="s-countries">—</div><div class="stat-lbl">參與國家</div></div>
    <div class="stat-card"><div class="stat-val" style="color:#BA7517" id="s-wins">—</div><div class="stat-lbl">中獎次數</div></div>
  </div>

  <div class="map-wrap">
    <div class="map-topbar">
      <span class="map-title">貓咪世界分佈</span>
      <div class="map-legend">
        <div class="leg"><div class="leg-dot" style="background:#7F77DD"></div>有貓咪</div>
        <div class="leg"><div class="leg-dot" style="background:#EF9F27"></div>已中獎</div>
        <div class="leg" style="font-size:10px">圓圈大小 = 貓咪數量</div>
      </div>
    </div>
    <div id="leafmap"></div>
  </div>

  <div class="cc-banner" id="cc-banner">
    <span style="font-size:14px;font-weight:500;color:#3C3489" id="banner-txt"></span>
    <button class="cc-close" onclick="clearCC()">清除篩選 ✕</button>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab on" id="tab-prize" onclick="setTab('prize')">💰 獎金榜</button>
    <button class="tab" id="tab-rate" onclick="setTab('rate')">🎯 中獎率榜</button>
    <button class="tab" id="tab-latest" onclick="setTab('latest')">🆕 最新選號</button>
  </div>
  <p class="tab-note" id="tab-note"></p>

  <div id="rank-list">
    <div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="js/safe.js"></script>
<script src="js/lottery.js"></script>
<script type="module">
import { auth, db } from "./js/firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { collection, getDocs, query, orderBy, limit }
  from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";
const { esc, img, int, ball, cc: safeCC } = window.Safe;

// 排行榜只算台灣大樂透（美日樂透之後再做）。不顯示任何人的「我買了」與損益。
const LV = { 1: '頭獎', 2: '貳獎', 3: '參獎', 4: '肆獎', 5: '伍獎', 6: '陸獎', 7: '柒獎', 8: '普獎' };
const NOTES = {
  prize: '依「若每注都買」的累積獎金排名；同金額時比中獎次數。',
  rate: '中獎率 = 中獎次數 ÷ 已對獎次數。不設門檻，同中獎率時對獎次數多的排前面。',
  latest: '最近的台灣大樂透選號，開獎後自動對獎。',
};

let me = null, cats = [], latest = [], tab = 'prize', ccFilter = 'all';
onAuthStateChanged(auth, u => { me = u; window.LC && LC.setUser(u ? u.uid : null); render(); });

// ── 讀資料：貓咪（含後端算好的統計）、最近 100 筆選號 ─────────
async function load() {
  const [cs, ds] = await Promise.all([
    getDocs(collection(db, 'cats')),
    getDocs(query(collection(db, 'draws'), orderBy('createdAt', 'desc'), limit(100))),
  ]);
  cs.forEach(d => cats.push({ id: d.id, ...d.data() }));
  ds.forEach(d => { const x = d.data(); if (x.lotType === 'tw' && x.tracked !== false) latest.push({ id: d.id, ...x }); });
}
try { await load(); } catch (e) {
  console.error(e);
  document.getElementById('rank-list').innerHTML = '<div class="empty">載入失敗，請重新整理</div>';
}

const S = c => c.stats || { twDraws: 0, checked: 0, wins: 0, prize: 0, bestLevel: 0, winRate: 0 };
const twCats = cats.filter(c => S(c).twDraws > 0);

// ── 上方統計 ────────────────────────────────────────────
const money = n => '$' + int(n).toLocaleString();
const short = n => n >= 1e8 ? (n / 1e8).toFixed(1) + '億' : n >= 1e4 ? (n / 1e4).toFixed(n >= 1e5 ? 0 : 1) + '萬' : int(n).toLocaleString();
document.getElementById('s-cats').textContent = twCats.length.toLocaleString();
document.getElementById('s-prize').textContent = '$' + short(twCats.reduce((s, c) => s + int(S(c).prize), 0));
document.getElementById('s-countries').textContent = new Set(twCats.map(c => safeCC(c.countryCode)).filter(Boolean)).size;
document.getElementById('s-wins').textContent = twCats.reduce((s, c) => s + int(S(c).wins), 0);

// ── 地圖：每個國家的貓咪數、中獎次數 ────────────────────────
function flagEmoji(cc) { return cc ? [...cc].map(c => String.fromCodePoint(127397 + c.charCodeAt())).join('') : ''; }
const CENT = {
  TW:[25.0,121.5],JP:[35.7,139.7],US:[37,-96],TR:[39,35],DE:[51.2,10.4],GB:[52,-1],FR:[46.2,2.2],KR:[37.5,127.5],
  CN:[35,105],AU:[-26,134],BR:[-15,-50],CA:[57,-100],MX:[24,-102],IN:[20,77],ID:[-5,120],TH:[15,101],SG:[1.3,103.8],
  MY:[4,110],PH:[12,122],VN:[16,108],IT:[42,12],ES:[40,-4],RU:[60,90],ZA:[-30,25],EG:[26,30],NG:[9,8],AR:[-35,-64],
  CL:[-35,-71],CO:[4,-74],PL:[52,20],NL:[52.3,5.3],BE:[50.5,4.5],SE:[60,18],NO:[62,10],CH:[47,8],AT:[47,14],PT:[39,-8],
  GR:[38,23],UA:[49,32],HK:[22.3,114.2],NZ:[-41,174],SA:[24,45],AE:[24,54],IL:[31,35],
};
const byCC = {};
twCats.forEach(c => {
  const cc = safeCC(c.countryCode); if (!cc) return;
  const g = byCC[cc] = byCC[cc] || { cats: 0, wins: 0, prize: 0, name: c.country || cc };
  g.cats++; g.wins += int(S(c).wins); g.prize += int(S(c).prize);
});
if (window.L) {
  const map = L.map('leafmap', { center: [20, 15], zoom: 2, minZoom: 1, maxZoom: 6, worldCopyJump: true });
  // 底圖：OpenStreetMap 官方圖磚（不需金鑰，須標示出處）。
  // 原本的 CARTO 底圖 2026-10 起需要金鑰，未帶金鑰會回傳「API KEY REQUIRED」圖片。
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors',
    maxZoom: 19,
  }).addTo(map);
  Object.entries(byCC).forEach(([cc, g]) => {
    if (!CENT[cc]) return;
    const m = L.circleMarker(CENT[cc], { radius: Math.min(10 + Math.sqrt(g.cats) * 8, 40), fillColor: g.wins ? '#EF9F27' : '#7F77DD',
      color: '#fff', weight: 2.5, opacity: 1, fillOpacity: 0.82 }).addTo(map);
    m.bindTooltip(`<strong>${flagEmoji(cc)} ${esc(g.name)}</strong><br>${g.cats} 隻貓咪 · ${g.wins} 次中獎`
      + (g.prize ? `<br>累積獎金 ${money(g.prize)}` : ''), { direction: 'top', offset: [0, -4] });
    m.on('click', () => {
      ccFilter = cc;
      window.LC && LC.track('map_country_click', { country_code: cc, cats_in_country: g.cats });
      document.getElementById('banner-txt').textContent = `${flagEmoji(cc)} ${g.name} — ${g.cats} 隻貓咪 · ${g.wins} 次中獎`;
      document.getElementById('cc-banner').classList.add('show');
      render();
      document.getElementById('rank-list').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

// ── 排名列表 ────────────────────────────────────────────
const rankColor = i => i === 0 ? '#BA7517' : i === 1 ? '#888780' : i === 2 ? '#993C1D' : '#AFA9EC';
const photoHtml = (src, alt) => img(src) ? `<img src="${img(src)}" alt="${esc(alt)}"/>` : '🐱';
const where = x => [x.city, x.country].filter(Boolean).join(', ');

function catRow(c, i, right) {
  const s = S(c), isMe = me && c.uid === me.uid;
  const best = s.bestLevel ? ` · 最佳 ${LV[s.bestLevel] || ''}` : '';
  return `<div class="rc ${isMe ? 'mine' : ''}">
    <div class="rc-num" style="color:${rankColor(i)}">${i + 1}</div>
    <div class="rc-photo">${photoHtml(c.photoThumb, c.catName)}</div>
    <div class="rc-body">
      <div class="rc-name">${esc(c.catName)}${isMe ? '<span class="badge-me">我的</span>' : ''}</div>
      <div class="rc-meta">${flagEmoji(safeCC(c.countryCode))} ${esc(where(c))}</div>
      <div class="rc-stats">大樂透 ${int(s.twDraws)} 筆 · 已對 ${int(s.checked)} · 中 ${int(s.wins)} 次${esc(best)}</div>
    </div>
    <div class="rc-right">${right}</div>
  </div>`;
}

function drawRow(d, i) {
  const isMe = me && d.uid === me.uid;
  const win = new Set((d.winNumbers || []).map(Number)), ws = d.winSpecial != null ? Number(d.winSpecial) : null;
  // 舊紀錄由貓自選的特別號不顯示（大樂透只看 6 碼）
  const balls = (d.numbers || []).map(n => {
    n = int(n);
    const cls = win.has(n) ? 'b hit' : ws === n ? 'b sp' : 'b';
    return `<div class="${cls}">${ball(n)}</div>`;
  }).join('');
  const target = d.drawDate || d.targetDrawDate;
  const lab = window.Lottery.dateLabel(target);
  const WD = '日一二三四五六';
  const when = lab ? `${lab.md}（${WD[lab.wd]}）開獎` : esc(d.date || '');
  const lv = int(d.prizeLevel);
  const status = !d.checkedAt ? '<span class="tag" style="background:#FAEEDA;color:#633806">待開獎</span>'
    : lv > 0 ? `<div style="font-size:13px;font-weight:600;color:#3B6D11">${money(d.prizeAmount)}</div><span class="tag" style="background:#EAF3DE;color:#27500A">${LV[lv]}</span>`
    : `<span class="tag" style="background:#FCEBEB;color:#791F1F">未中獎</span>`;
  return `<div class="rc ${isMe ? 'mine' : ''}">
    <div class="rc-photo">${photoHtml(d.photoThumb, d.catName)}</div>
    <div class="rc-body">
      <div class="rc-name">${esc(d.catName)}${isMe ? '<span class="badge-me">我的</span>' : ''}</div>
      <div class="rc-meta">${flagEmoji(safeCC(d.countryCode))} ${esc(where(d))} · ${when}${d.drawPeriod ? ' · 第 ' + esc(d.drawPeriod) + ' 期' : ''}</div>
      <div class="balls">${balls}</div>
    </div>
    <div class="rc-right">${status}</div>
  </div>`;
}

function render() {
  const el = document.getElementById('rank-list');
  document.getElementById('tab-note').textContent = NOTES[tab];
  const inCC = x => ccFilter === 'all' || safeCC(x.countryCode) === ccFilter;
  let html = '';
  if (tab === 'latest') {
    const items = latest.filter(inCC);
    html = items.map(drawRow).join('');
  } else if (tab === 'prize') {
    const items = twCats.filter(inCC).sort((a, b) =>
      int(S(b).prize) - int(S(a).prize) || int(S(b).wins) - int(S(a).wins) || int(S(b).checked) - int(S(a).checked));
    html = items.map((c, i) => catRow(c, i,
      `<div class="rc-big" style="color:${S(c).prize ? '#BA7517' : '#B4B2A9'}">${money(S(c).prize)}</div>`)).join('');
  } else {
    const items = twCats.filter(c => inCC(c) && int(S(c).checked) > 0).sort((a, b) =>
      (S(b).winRate || 0) - (S(a).winRate || 0) || int(S(b).checked) - int(S(a).checked) || int(S(b).prize) - int(S(a).prize));
    html = items.map((c, i) => catRow(c, i,
      `<div class="rc-big" style="color:${S(c).wins ? '#3B6D11' : '#B4B2A9'}">${Math.round((S(c).winRate || 0) * 1000) / 10}%</div>`
      + `<div class="rc-sub">${int(S(c).wins)} / ${int(S(c).checked)}</div>`)).join('');
  }
  el.innerHTML = html ? `<div class="rank-list">${html}</div>`
    : '<div class="empty"><div style="font-size:48px;margin-bottom:12px">🐱</div><p style="font-size:15px;font-weight:500;margin-bottom:5px">這裡還沒有貓咪</p><p style="font-size:13px">換個篩選或成為第一個！</p></div>';
}

window.setTab = function (t) {
  if (t !== tab) window.LC && LC.track('rank_tab', { tab: t });
  tab = t;
  ['prize', 'rate', 'latest'].forEach(k => document.getElementById('tab-' + k).classList.toggle('on', k === t));
  render();
};
window.clearCC = function () {
  window.LC && LC.track('rank_filter_clear');
  ccFilter = 'all';
  document.getElementById('cc-banner').classList.remove('show');
  render();
};
render();
</script>
</body>
</html>
